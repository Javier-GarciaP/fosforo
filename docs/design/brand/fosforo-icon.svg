      <stop offset="0" stop-color="#ffd98f"/><stop offset="0.5" stop-color="#ff8f4e"/><stop offset="1" stop-color="#ff4a33"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#tile)"/>
  <ellipse cx="256" cy="156" rx="136" ry="136" fill="url(#ember)"/>
  <ellipse cx="256" cy="350" rx="150" ry="150" fill="url(#phosphor)"/>
  <rect x="222" y="200" width="68" height="240" rx="34" fill="url(#stick)"/>
  <ellipse cx="256" cy="168" rx="66" ry="80" fill="url(#head)"/>
  <ellipse cx="236" cy="134" rx="14" ry="22" fill="#ffffff" fill-opacity="0.3"/>
