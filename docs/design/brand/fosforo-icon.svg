<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="fosforo">
  <title>fosforo</title>
  <!-- Mismo dibujo que docs/design/src/12-marca.js (variante oscura). Mantener ambos iguales. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#222a47"/><stop offset="1" stop-color="#0d111d"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a50" stop-opacity="0.44"/><stop offset="1" stop-color="#ff8a50" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="phosphor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#69f19a" stop-opacity="0.25"/><stop offset="1" stop-color="#69f19a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aaffc9"/><stop offset="1" stop-color="#3fd47f"/>
    </linearGradient>
