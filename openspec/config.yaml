schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: editor de terminal (TUI) con la comodidad de VS Code y la fluidez de Neovim.
  - Stack: Go + Bubble Tea (bucle Model/Update/View), Lip Gloss, Glamour (Markdown), Chroma (sintaxis).
  - Teclado primero: modos Normal/Insert/Visual/Command + tecla lider Space; el mouse es apoyo.
  - Principio de arquitectura: todo es un comando con nombre (teclas, paleta, ":" y menu lider usan el mismo registro).
  - Paquetes previstos: buffer, editor, keymap, command, ui, syntax, markdown, fs, config (ver docs/README.md).
  - Diseno visual de referencia: docs/design/exports/*.png (fuente: docs/design/editor.op, abrir con OpenPencil).
  - Fuera de v1: pestanas visuales, terminal integrada, LSP, git, plugins.
  - Flujo de trabajo: ver CONTRIBUTING.md (main estable, dev integra, una rama por cambio, PR a dev).

rules:
  proposal:
    - Indicar siempre que queda fuera de alcance (Non-goals).
    - Enlazar la pantalla de docs/design/exports que corresponda cuando el cambio tenga UI.
  specs:
    - Cada requisito usa SHALL/MUST y al menos un escenario WHEN/THEN verificable.
    - Describir comportamiento observable (teclas, salida en pantalla), no detalles de implementacion.
  design:
    - Nombrar los paquetes de Go afectados y sus interfaces publicas.
    - Explicar los riesgos conocidos (Unicode/ancho de caracteres, rendimiento, conflictos de teclas).
  tasks:
    - Tareas de maximo ~2 horas, con casillas [ ] y numeradas por seccion.
    - Incluir tareas de pruebas (unitarias y de modelo Bubble Tea con teatest) junto a cada funcionalidad.
